version: '3.8'

services:
  mosquitto:
    build: .
    container_name: mosquitto-jwt
    ports:
      - "1883:1883"  # mTLS (MQTT)
      - "8887:8887"  # JWT (WebSockets)
    volumes:
      - ./certs:/mosquitto/certs  # TLS certs
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    env_file:
      - ./.env
    restart: unless-stopped